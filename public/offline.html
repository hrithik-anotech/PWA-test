<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFCFF" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Snibto is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fcfcff;
        color: #111111;
      }

      main {
        width: min(100% - 48px, 360px);
        text-align: center;
      }

      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 28px;
        background: linear-gradient(135deg, #5b2fd1, #8b5cf6);
        color: white;
        font-size: 42px;
        font-weight: 800;
        box-shadow: 0 20px 50px rgb(91 47 209 / 28%);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 28px;
        color: #666272;
        line-height: 1.6;
      }

      button {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 16px;
        background: #6c35ff;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #120d24;
          color: #ffffff;
        }

        p {
          color: #bdb6d6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">S</div>
      <h1>You are offline</h1>
      <p>Snibto saved the app shell. Reconnect to load fresh services and bookings.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
